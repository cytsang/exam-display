<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPSLT Exam Display</title>

  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;

      /* right side dynamic font vars (JS updates these) */
      --mainFont: 64px;  /* subject title */
      --timeFont: 40px;  /* time line */
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "PingFang HK", "Noto Sans TC", Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
    }

    .stage{
      width: min(1200px, 100%);
      display:flex;
      gap: 28px;
      align-items:center;
    }

    /* ===== LEFT CLOCK ===== */
    .clockShell{
      flex: 1 1 60%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .clockCircle{
      width: min(560px, 68vw);
      aspect-ratio: 1 / 1;
      border: 10px solid #2563eb;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 12px 30px rgba(37,99,235,.25);
      padding: 16px;
      position: relative;
    }

    .face{
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at center, rgba(0,0,0,.06) 0 2px, transparent 3px),
        radial-gradient(circle at center, rgba(0,0,0,.04) 0 55%, transparent 56%),
        #fff7cc;
      overflow:hidden;
    }

    .mark{
      position:absolute;
      left:50%; top:50%;
      width:7px; height:22px;
      background:rgba(17,24,39,.70);
      border-radius:6px;
      transform:translate(-50%,-50%) rotate(0deg) translateY(-46%);
      z-index: 1;
    }
    .mark.minor{
      width:3px; height:12px;
      background:rgba(17,24,39,.25);
    }

    /* numbers: doubled */
    .num{
      position:absolute;
      transform: translate(-50%, -50%);
      font-weight: 900;
      font-size: clamp(36px, 4.5vw, 52px);
      color: rgba(17,24,39,.85);
      user-select:none;
      pointer-events:none;
      z-index: 2;
    }

    .hand{
      position:absolute;
      left:50%; top:50%;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      border-radius: 999px;
      z-index: 4;
    }
    .hand.hour{ width:14px; height:30%; background:#111827; }
    .hand.minute{ width:10px; height:42%; background:#1f2937; }
    .hand.second{ width:3px; height:48%; background:#dc2626; z-index: 6; }

    .hub{
      position:absolute;
      left:50%; top:50%;
      width:18px; height:18px;
      background:#111827;
      border-radius:50%;
      transform: translate(-50%, -50%);
      z-index: 7;
    }

    /* digital readout box */
    .readout{
      position:absolute;
      left:50%;
      bottom:18%; /* near slightly below center */
      transform: translateX(-50%);
      text-align:center;
      background: rgba(255,255,255,.90);
      border-radius: 14px;
      padding: 10px 16px;
      min-width: 260px;
      z-index: 8;
      border: 1px solid rgba(0,0,0,.10);
    }
    .digital{
      font-weight: 900;
      font-size: 44px;  /* larger digits */
      line-height: 1.05;
      letter-spacing: .5px;
      font-variant-numeric: tabular-nums;
    }
    .status{
      font-size: 10px; /* smaller status */
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.05;
    }

    /* ===== RIGHT SIDE ===== */
    .side{
      flex: 0 0 min(560px, 100%);
      height: min(560px, 74vh);
      display:flex;
      flex-direction:column;
      position: relative;
    }

    /* list of groups fills height */
    .groups{
      flex: 1;
      min-height: 0;
      display:flex;
      flex-direction:column;
      gap: 20px;
      padding-right: 86px; /* reserve for + button */
    }

    /* each group shares height equally */
    .group{
      flex: 1;
      min-height: 0;
      display:flex;
      flex-direction:column;
      gap: 16px;
      position: relative;
    }

    /* field boxes are layout containers (no border) */
    .field{
      flex: 0 0 auto;
      min-height: 0;
      display:flex;          /* important: let inner control fill */
      align-items: stretch;
      justify-content: stretch;
      border: none;
      background: transparent;
      padding: 0;
    }
    /* ratio 5:4 */
    .field.main{ flex: 5; }
    .field.time{ flex: 4; }

    /* controls fill their fields */
    textarea.mainInput,
    input.timeInput{
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      text-align: center;
      padding: 0;
      margin: 0;
      color: var(--text);
      letter-spacing: .3px;
      line-height: 1.05;
      overflow: hidden;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      font-smoothing: antialiased;

      /* stop red underline */
      spellcheck: false;
    }

    /* subject title bigger + bold */
    textarea.mainInput{
      font-size: var(--mainFont);
      font-weight: 900;
      resize: none;
    }

    /* time smaller + not bold */
    input.timeInput{
      font-size: var(--timeFont);
      font-weight: 400;
    }

    /* placeholders */
    textarea.mainInput::placeholder,
    input.timeInput::placeholder{
      color: rgba(17,17,17,.28);
    }
    textarea.mainInput::placeholder{ font-weight: 800; }
    input.timeInput::placeholder{ font-weight: 400; }

    /* delete button */
    .delBtn{
      position:absolute;
      right: 0;
      top: 0;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.12);
      background: #fff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 10;
    }
    .delBtn:active{ transform: translateY(1px); }

    /* plus button */
    .addBtn{
      position:absolute;
      right: 10px;
      bottom: 10px;
      width: 62px;
      height: 62px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.12);
      background: #fff;
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .addBtn[disabled]{ opacity:.40; cursor:not-allowed; }
    .addBtn:active{ transform: translateY(1px); }

    @media (max-width: 900px){
      .stage{ flex-direction:column; }
      .side{ width: min(640px, 100%); height: min(560px, 60vh); }
      .groups{ padding-right: 0; }
      .addBtn{ right: 12px; bottom: 12px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage">

      <!-- LEFT clock -->
      <div class="clockShell">
        <div class="clockCircle">
          <div class="face" id="face">
            <div class="hand hour" id="hHand"></div>
            <div class="hand minute" id="mHand"></div>
            <div class="hand second" id="sHand"></div>
            <div class="hub"></div>

            <div class="readout">
              <div class="digital" id="digital">--:--:--</div>
              <div class="status" id="syncStatus">Syncing…</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT textboxes -->
      <div class="side" id="side">
        <div class="groups" id="groups">
          <!-- Group 1 -->
          <div class="group">
            <button class="delBtn" type="button" aria-label="Delete this pair">×</button>

            <div class="field main">
              <textarea class="mainInput" rows="2" placeholder="Level / Subj / Paper" spellcheck="false"></textarea>
            </div>

            <div class="field time">
              <input class="timeInput" type="text" placeholder="Time" spellcheck="false" />
            </div>
          </div>
        </div>

        <button class="addBtn" id="addBtn" type="button" aria-label="Add another pair">＋</button>
      </div>

    </div>
  </div>

  <script>
    // ====== Build marks + numbers ======
    const face = document.getElementById("face");

    for (let i = 0; i < 60; i++){
      const isHour = (i % 5 === 0);
      const d = document.createElement("div");
      d.className = "mark" + (isHour ? "" : " minor");
      d.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg) translateY(-46%)`;
      face.appendChild(d);
    }

    // numbers 1..12 (radius tuned for big digits + readout)
    const R = 43;
    for (let n = 1; n <= 12; n++){
      const a = (n * 30 - 90) * Math.PI / 180;
      const el = document.createElement("div");
      el.className = "num";
      el.textContent = String(n);
      el.style.left = (50 + R * Math.cos(a)) + "%";
      el.style.top  = (50 + R * Math.sin(a)) + "%";
      face.appendChild(el);
    }

    // ====== Online sync via Apps Script ======
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydFg6fSuA9KQn5ZY42PRn2t09tq2Kqbrsv3TlqDPIVyNpNEadheHSmr3t2bZGxONEh/exec";
    const TZ = "Asia/Hong_Kong";

    const hHand = document.getElementById("hHand");
    const mHand = document.getElementById("mHand");
    const sHand = document.getElementById("sHand");
    const digital = document.getElementById("digital");
    const syncStatus = document.getElementById("syncStatus");

    let offsetMs = 0;
    let onlineSynced = false;

    const digitalFmt = new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ,
      hour: "2-digit", minute: "2-digit", second: "2-digit",
      hour12: false
    });

    function hkParts(date){
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ,
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      }).formatToParts(date);

      return {
        hh: Number(parts.find(p => p.type === "hour").value),
        mm: Number(parts.find(p => p.type === "minute").value),
        ss: Number(parts.find(p => p.type === "second").value),
      };
    }

    function render(epochMs){
      const d = new Date(epochMs);
      digital.textContent = digitalFmt.format(d);

      const {hh, mm, ss} = hkParts(d);
      const hour12 = hh % 12;

      // seconds: tick and align to digital seconds
      const secDeg = ss * 6;
      const minDeg = (mm + ss/60) * 6;
      const hourDeg = (hour12 + mm/60 + ss/3600) * 30;

      sHand.style.transform = `translate(-50%, -100%) rotate(${secDeg}deg)`;
      mHand.style.transform = `translate(-50%, -100%) rotate(${minDeg}deg)`;
      hHand.style.transform = `translate(-50%, -100%) rotate(${hourDeg}deg)`;
    }

    function tick(){
      render(Date.now() + offsetMs);
    }

    async function syncOnce(){
      try{
        syncStatus.textContent = "Syncing (online)…";
        const t0 = performance.now();
        const res = await fetch(SCRIPT_URL, { cache: "no-store" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if(typeof data.epochMs !== "number") throw new Error("Missing epochMs");

        const serverEpoch = data.epochMs;
        const t1 = performance.now();
        const rtt = (t1 - t0);
        const approxLocalAtMid = Date.now() - (rtt / 2);

        offsetMs = serverEpoch - approxLocalAtMid;
        onlineSynced = true;
        syncStatus.textContent = "Online synced ✓";
      }catch(e){
        syncStatus.textContent = onlineSynced ? "Sync failed (keeping last sync)" : "Offline fallback (device clock)";
      }
    }

    (async () => {
      await syncOnce();
      tick();
      setInterval(tick, 1000);
      setInterval(syncOnce, 3 * 60 * 1000);
    })();

    // ====== Groups: max 3, add/delete, auto font sizing ======
    const MAX_GROUPS = 3;

    const sideEl = document.getElementById("side");
    const groupsEl = document.getElementById("groups");
    const addBtn = document.getElementById("addBtn");

    // base targets (1 group)
    const TARGET_MAIN = 90; // allow bigger than before, we will clamp by height
    const TARGET_TIME = 60;

    // keep subject > time
    const TIME_RATIO = 0.62;     // time ≈ 62% of subject

    const MIN_MAIN = 28;
    const MIN_TIME = 18;

    function groupCount(){
      return groupsEl.querySelectorAll(".group").length;
    }

    function refreshAddButtonState(){
      addBtn.disabled = groupCount() >= MAX_GROUPS;
    }

    function clearGroupInputs(groupEl){
      const ta = groupEl.querySelector(".mainInput");
      const ti = groupEl.querySelector(".timeInput");
      if (ta) ta.value = "";
      if (ti) ti.value = "";
      if (ta) ta.focus();
    }

    function attachDeleteHandler(groupEl){
      const del = groupEl.querySelector(".delBtn");
      if (!del) return;

      del.addEventListener("click", () => {
        const n = groupCount();
        if (n <= 1){
          clearGroupInputs(groupEl);
          return;
        }
        groupEl.remove();
        updateSmartFonts();
      });
    }

    function createGroup(){
      const group = document.createElement("div");
      group.className = "group";
      group.innerHTML = `
        <button class="delBtn" type="button" aria-label="Delete this pair">×</button>
        <div class="field main">
          <textarea class="mainInput" rows="2" placeholder="Level / Subj / Paper" spellcheck="false"></textarea>
        </div>
        <div class="field time">
          <input class="timeInput" type="text" placeholder="Time" spellcheck="false" />
        </div>
      `;
      attachDeleteHandler(group);
      return group;
    }

    addBtn.addEventListener("click", () => {
      if (groupCount() >= MAX_GROUPS) return;
      const g = createGroup();
      groupsEl.appendChild(g);
      updateSmartFonts();
      const ta = g.querySelector(".mainInput");
      if (ta) ta.focus();
    });

    // init delete handler for first group
    groupsEl.querySelectorAll(".group").forEach(attachDeleteHandler);

    function pxToNum(px){
      const n = Number(String(px).replace("px",""));
      return Number.isFinite(n) ? n : 0;
    }

    function contentHeight(el){
      const cs = getComputedStyle(el);
      const pt = pxToNum(cs.paddingTop);
      const pb = pxToNum(cs.paddingBottom);
      return Math.max(0, el.clientHeight - pt - pb);
    }

    function maxFontOneLine(fieldEl, lineHeight){
      // guarantee at least 1 full line visible
      const h = contentHeight(fieldEl);
      const safety = 6;
      const usable = Math.max(0, h - safety);
      return Math.floor(usable / lineHeight);
    }

    function updateSmartFonts(){
      refreshAddButtonState();

      requestAnimationFrame(() => {
        const first = groupsEl.querySelector(".group");
        if (!first) return;

        const mainField = first.querySelector(".field.main");
        const timeField = first.querySelector(".field.time");
        if (!mainField || !timeField) return;

        // compute by field heights (these shrink automatically as groups increase)
        const mainMaxByHeight = maxFontOneLine(mainField, 1.05);
        const timeMaxByHeight = maxFontOneLine(timeField, 1.05);

        // start from generous targets, clamp by height
        let main = Math.min(TARGET_MAIN, mainMaxByHeight);
        let time = Math.min(TARGET_TIME, Math.floor(main * TIME_RATIO), timeMaxByHeight);

        // keep strict relation: main > time
        if (time >= main) time = Math.max(MIN_TIME, main - 2);

        // lower bounds
        main = Math.max(MIN_MAIN, main);
        time = Math.max(MIN_TIME, time);

        // apply
        document.documentElement.style.setProperty("--mainFont", main + "px");
        document.documentElement.style.setProperty("--timeFont", time + "px");
      });
    }

    window.addEventListener("resize", updateSmartFonts);
    updateSmartFonts();
  </script>
</body>
</html>
